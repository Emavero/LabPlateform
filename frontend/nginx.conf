# Nginx sert l'application et relaie /api vers le backend : navigateur et API
# partagent la même origine, condition pour que le cookie de session
# SameSite=Strict soit envoyé (et aucune configuration CORS n'est nécessaire).
# Derrière un proxy TLS (ngrok, load balancer), on conserve le protocole
# d'origine (https) au lieu de le remplacer par celui de Nginx (http) : sinon
# le backend voit une origine différente et refuse les requêtes.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Fichiers générés par Vite : leur nom contient une empreinte, cache long.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Routes de la SPA : toute URL inconnue renvoie index.html, jamais mis en cache.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
