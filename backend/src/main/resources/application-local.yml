# Profil "local" : lancement sans Docker ni PostgreSQL (mvn spring-boot:run -Dspring-boot.run.profiles=local).
# Base H2 en mémoire en mode compatibilité PostgreSQL ; les données sont perdues à l'arrêt.
spring:
  datasource:
    url: jdbc:h2:mem:labplatform;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  sql:
    init:
      mode: always

app:
  media:
    # Développement : les vidéos restent dans le dossier du projet (ignoré par git).
    directory: ${APP_MEDIA_DIRECTORY:./data/media}
  vpn:
    # En développement, la PKI est créée dans le dossier du projet (ignoré par git).
    directory: ${APP_VPN_DIRECTORY:./data/vpn}
  security:
    # Vrai par défaut en développement — il n'y a pas de serveur d'e-mail —
    # mais la variable reste maîtresse : sans cela, brancher un envoi réel en
    # profil local laisserait le jeton dans la réponse HTTP malgré la consigne.
    expose-reset-token-in-response: ${APP_EXPOSE_RESET_TOKEN:true}
  boxes:
    # Développement : les flags du catalogue sont affichés au démarrage.
    log-seeded-flags: true
