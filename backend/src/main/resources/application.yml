server:
  port: 8080
  # Derrière le reverse proxy Nginx du conteneur frontend.
  forward-headers-strategy: framework

spring:
  application:
    name: lab-platform-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labplatform}
    username: ${DB_USERNAME:labplatform}
    password: ${DB_PASSWORD:labplatform}

  # Le schéma est défini en SQL (db/schema.sql), pas généré par Hibernate.
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  # Téléversement des vidéos de cours : la borne du serveur doit rester au
  # moins égale à app.media.max-file-size, sinon Tomcat refuse avant nous.
  servlet:
    multipart:
      max-file-size: ${APP_MEDIA_MAX_FILE_SIZE:256MB}
      max-request-size: ${APP_MEDIA_MAX_FILE_SIZE:256MB}

  # Serveur d'envoi. Rien n'est contacté tant que app.mail.enabled est faux.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:false}
          # STARTTLS : exigé par la plupart des services (Gmail, Brevo, Mailgun)
          # sur le port 587. Un serveur local de test s'en passe.
          starttls:
            enable: ${MAIL_STARTTLS:false}
          connecttimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      # La sonde du courrier est éteinte volontairement.
      #
      # Depuis que le starter mail est présent, l'actuator tente d'ouvrir une
      # connexion SMTP à chaque appel de /actuator/health. Un serveur d'envoi
      # absent ou injoignable faisait alors répondre DOWN à toute la
      # plateforme — donc un conteneur « unhealthy », donc un frontend qui
      # refuse de démarrer, pour une fonction accessoire qui n'empêche
      # personne de jouer ni d'apprendre.
      #
      # C'est la même règle que dans SmtpPasswordResetNotifier : une panne du
      # courrier se journalise, elle n'arrête rien.
      enabled: false

app:
  # Adresse publique de l'application : c'est elle qui rend cliquables les liens
  # envoyés par courriel. À changer derrière ngrok ou un nom de domaine.
  public-url: ${APP_PUBLIC_URL:http://localhost:3000}
  mail:
    # Faux : le lien de réinitialisation s'affiche à l'écran (démonstration).
    # Vrai : il part par SMTP, et app.security.expose-reset-token-in-response
    # doit alors repasser à faux.
    enabled: ${APP_MAIL_ENABLED:false}
    from: ${APP_MAIL_FROM:cyberMans <no-reply@cybermans.local>}
  jwt:
    # Valeur de développement uniquement : définir APP_JWT_SECRET (32 octets minimum) en production.
    secret: ${APP_JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    validity: ${APP_JWT_VALIDITY:8h}
  session:
    cookie-name: LAB_SESSION
    # Passer à true dès que l'application est servie en HTTPS.
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cookie-same-site: Strict
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # true uniquement pour les démos sans serveur d'e-mail : le jeton de
    # réinitialisation est alors renvoyé dans la réponse HTTP.
    expose-reset-token-in-response: ${APP_EXPOSE_RESET_TOKEN:false}
    reset-token-validity: 15m
    # Comptes administrateurs, séparés par des virgules. Ils accèdent au
    # tableau de bord d'administration ; le rôle ne s'obtient pas autrement.
    admin-emails: ${APP_ADMIN_EMAILS:}
  # Abonnement Pro et encaissement.
  billing:
    # false ouvre toute la plateforme : aucun contenu réservé, aucune page
    # d'abonnement utile. À garder pour un lab interne.
    enabled: ${APP_BILLING_ENABLED:true}
    # « simulated » déroule le parcours sans prestataire — pratique en
    # développement, mais l'abonnement s'obtient alors en cliquant. « live »
    # appelle réellement Stripe et Wave avec les clés ci-dessous.
    mode: ${APP_BILLING_MODE:simulated}
    methods: ${APP_BILLING_METHODS:CARD,WAVE}
    # Tarif de base, écrit comme il s'affiche. Le XOF n'a pas de subdivision.
    currency: ${APP_BILLING_CURRENCY:XOF}
    monthly: ${APP_BILLING_MONTHLY:5000}
    yearly: ${APP_BILLING_YEARLY:50000}
    # Les réseaux bancaires n'acceptent pas le franc CFA : la carte a son tarif.
    card:
      currency: ${APP_BILLING_CARD_CURRENCY:EUR}
      monthly: ${APP_BILLING_CARD_MONTHLY:8.00}
      yearly: ${APP_BILLING_CARD_YEARLY:80.00}
    success-url: ${APP_BILLING_SUCCESS_URL:http://localhost:3000/abonnement/retour}
    cancel-url: ${APP_BILLING_CANCEL_URL:http://localhost:3000/abonnement}
    stripe:
      secret-key: ${STRIPE_SECRET_KEY:}
      webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    wave:
      api-key: ${WAVE_API_KEY:}
      webhook-secret: ${WAVE_WEBHOOK_SECRET:}
  # Fichiers téléversés (vidéos de cours).
  media:
    directory: ${APP_MEDIA_DIRECTORY:/var/lib/labplatform/media}
    max-file-size: ${APP_MEDIA_MAX_FILE_SIZE:256MB}
  # Catalogue de machines à compromettre (flags, points, classement).
  boxes:
    # true uniquement pour les démonstrations : les machines étant simulées,
    # les flags tirés au premier démarrage sont écrits dans les journaux,
    # faute de pouvoir aller les chercher sur la cible.
    log-seeded-flags: ${APP_BOXES_LOG_SEEDED_FLAGS:false}
    leaderboard-size: ${APP_BOXES_LEADERBOARD_SIZE:20}
    # Durée de vie d'une cible lancée à la demande, avant extinction.
    instance-lifetime: ${APP_BOXES_INSTANCE_LIFETIME:2h}
  # Accès VPN façon Hack The Box : chaque utilisateur télécharge son profil .ovpn.
  vpn:
    enabled: ${APP_VPN_ENABLED:false}
    # Adresse publique de la passerelle OpenVPN (IP, nom de domaine ou adresse ngrok).
    udp-host: ${APP_VPN_UDP_HOST:}
    udp-port: ${APP_VPN_UDP_PORT:1194}
    # Variante TCP, pour les réseaux qui bloquent l'UDP. Vide = non proposée.
    tcp-host: ${APP_VPN_TCP_HOST:}
    tcp-port: ${APP_VPN_TCP_PORT:1194}
    lab-network: ${APP_VPN_LAB_NETWORK:10.10.10.0/24}
    easyrsa-binary: ${APP_VPN_EASYRSA:/usr/share/easy-rsa/easyrsa}
    # Dossier persistant : autorité de certification et clé tls-crypt.
    directory: ${APP_VPN_DIRECTORY:/var/lib/labplatform/vpn}
    ca-name: cyberMans-Lab-CA
    server-name: serveur
    command-timeout: 120s
    crl-refresh: 1d
  # ---------------------------------------------------------------------------
  # Google Compute Engine. Le projet, la zone et l'instance viennent de
  # l'environnement ; les identifiants, eux, viennent des « identifiants par
  # défaut de l'application » : GOOGLE_APPLICATION_CREDENTIALS pointant sur la
  # clé du compte de service, ou l'identité attachée à la machine si la
  # plateforme tourne elle-même sur GCP. Aucune clé n'est lue ici, et aucune ne
  # sort du serveur. Voir docs/GCP.md.
  # ---------------------------------------------------------------------------
  gcp:
    project-id: ${GCP_PROJECT_ID:}
    zone: ${GCP_ZONE:europe-west1-b}
    instance-name: ${GCP_INSTANCE_NAME:target-01}
    # Nom d'instance d'une cible du catalogue qui n'en déclare pas : {slug} est
    # remplacé par l'identifiant de la machine (« obsidian » → « target-obsidian »).
    target-name: ${GCP_TARGET_NAME:target-{slug}}
    operation-timeout: ${GCP_OPERATION_TIMEOUT:60s}

  # Cible partagée pilotée par /api/machine : « simulated » (défaut, aucune
  # dépendance) ou « gcp ».
  machine:
    provider: ${APP_MACHINE_PROVIDER:simulated}
    simulated-address: ${APP_MACHINE_SIMULATED_ADDRESS:10.10.10.10}

  hypervisor:
    # simulated | docker | gcp
    mode: ${APP_HYPERVISOR_MODE:simulated}
    default-username: labuser
    simulated-subnet-prefix: "10.42"
    simulated-boot-delay: ${APP_SIMULATED_BOOT_DELAY:1500ms}
    simulated-shutdown-delay: ${APP_SIMULATED_SHUTDOWN_DELAY:600ms}
    # Mode docker : la machine Linux est un vrai conteneur accessible en SSH.
    docker:
      binary: ${APP_DOCKER_BINARY:docker}
      image: ${APP_DOCKER_IMAGE:labplatform/lab-linux:latest}
      # Adresse que l'utilisateur tape dans sa commande ssh.
      public-host: ${APP_DOCKER_PUBLIC_HOST:localhost}
      # 127.0.0.1 : accessible depuis ce poste uniquement ; 0.0.0.0 : depuis le réseau.
      bind-address: ${APP_DOCKER_BIND_ADDRESS:127.0.0.1}
      network: ${APP_DOCKER_NETWORK:}
      memory: ${APP_DOCKER_MEMORY:512m}
      cpus: ${APP_DOCKER_CPUS:1.0}
      pids-limit: 256
      container-prefix: labplatform-vm-
      command-timeout: 60s
      # Temps laissé au conteneur pour créer son compte, générer ses clés SSH
      # et poser son marqueur. Vingt secondes suffisent sur une machine au
      # repos, mais pas juste après un « up --build », ni sur Docker Desktop
      # dont les écritures sont plus lentes. Attendre ne coûte rien quand tout
      # va vite : la boucle rend la main dès que le marqueur existe.
      ready-timeout: ${APP_DOCKER_READY_TIMEOUT:45s}
      poll-interval: 250ms

logging:
  level:
    com.labplatform: INFO
