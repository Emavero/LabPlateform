server:
  port: 8080
  # Derrière le reverse proxy Nginx du conteneur frontend.
  forward-headers-strategy: framework

spring:
  application:
    name: lab-platform-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/labplatform}
    username: ${DB_USERNAME:labplatform}
    password: ${DB_PASSWORD:labplatform}

  # Le schéma est défini en SQL (db/schema.sql), pas généré par Hibernate.
  sql:
    init:
      mode: ${DB_INIT_MODE:always}
      schema-locations: classpath:db/schema.sql
      encoding: UTF-8

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    # Valeur de développement uniquement : définir APP_JWT_SECRET (32 octets minimum) en production.
    secret: ${APP_JWT_SECRET:dev-only-secret-key-change-me-please-32bytes-min}
    validity: ${APP_JWT_VALIDITY:8h}
  session:
    cookie-name: LAB_SESSION
    # Passer à true dès que l'application est servie en HTTPS.
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cookie-same-site: Strict
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    # true uniquement pour les démos sans serveur d'e-mail : le jeton de
    # réinitialisation est alors renvoyé dans la réponse HTTP.
    expose-reset-token-in-response: ${APP_EXPOSE_RESET_TOKEN:false}
    reset-token-validity: 15m
  # Catalogue de machines à compromettre (flags, points, classement).
  boxes:
    # true uniquement pour les démonstrations : les machines étant simulées,
    # les flags tirés au premier démarrage sont écrits dans les journaux,
    # faute de pouvoir aller les chercher sur la cible.
    log-seeded-flags: ${APP_BOXES_LOG_SEEDED_FLAGS:false}
    leaderboard-size: ${APP_BOXES_LEADERBOARD_SIZE:20}
  # Accès VPN façon Hack The Box : chaque utilisateur télécharge son profil .ovpn.
  vpn:
    enabled: ${APP_VPN_ENABLED:false}
    # Adresse publique de la passerelle OpenVPN (IP, nom de domaine ou adresse ngrok).
    udp-host: ${APP_VPN_UDP_HOST:}
    udp-port: ${APP_VPN_UDP_PORT:1194}
    # Variante TCP, pour les réseaux qui bloquent l'UDP. Vide = non proposée.
    tcp-host: ${APP_VPN_TCP_HOST:}
    tcp-port: ${APP_VPN_TCP_PORT:1194}
    lab-network: ${APP_VPN_LAB_NETWORK:10.10.10.0/24}
    easyrsa-binary: ${APP_VPN_EASYRSA:/usr/share/easy-rsa/easyrsa}
    # Dossier persistant : autorité de certification et clé tls-crypt.
    directory: ${APP_VPN_DIRECTORY:/var/lib/labplatform/vpn}
    ca-name: cyberMans-Lab-CA
    server-name: serveur
    command-timeout: 120s
    crl-refresh: 1d
  hypervisor:
    mode: ${APP_HYPERVISOR_MODE:simulated}
    default-username: labuser
    simulated-subnet-prefix: "10.42"
    simulated-boot-delay: ${APP_SIMULATED_BOOT_DELAY:1500ms}
    simulated-shutdown-delay: ${APP_SIMULATED_SHUTDOWN_DELAY:600ms}
    # Mode docker : la machine Linux est un vrai conteneur accessible en SSH.
    docker:
      binary: ${APP_DOCKER_BINARY:docker}
      image: ${APP_DOCKER_IMAGE:labplatform/lab-linux:latest}
      # Adresse que l'utilisateur tape dans sa commande ssh.
      public-host: ${APP_DOCKER_PUBLIC_HOST:localhost}
      # 127.0.0.1 : accessible depuis ce poste uniquement ; 0.0.0.0 : depuis le réseau.
      bind-address: ${APP_DOCKER_BIND_ADDRESS:127.0.0.1}
      network: ${APP_DOCKER_NETWORK:}
      memory: ${APP_DOCKER_MEMORY:512m}
      cpus: ${APP_DOCKER_CPUS:1.0}
      pids-limit: 256
      container-prefix: labplatform-vm-
      command-timeout: 60s
      ready-timeout: 20s
      poll-interval: 250ms

logging:
  level:
    com.labplatform: INFO
