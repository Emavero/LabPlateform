# Lancement complet : docker compose up --build
# Application : http://localhost:3000 (port modifiable via FRONTEND_PORT)
name: labplatform

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-labplatform}
      POSTGRES_USER: ${DB_USERNAME:-labplatform}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-labplatform}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Création automatique des tables au premier démarrage du volume.
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-labplatform}
      DB_USERNAME: ${DB_USERNAME:-labplatform}
      DB_PASSWORD: ${DB_PASSWORD:-labplatform}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-in-env-file-with-at-least-32-bytes!!}
      APP_JWT_VALIDITY: ${APP_JWT_VALIDITY:-8h}
      # false tant que l'application est servie en HTTP (localhost).
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      # Démo sans serveur d'e-mail : le lien de réinitialisation est affiché à l'écran.
      # À passer à false dès que l'envoi de courriels est actif.
      APP_EXPOSE_RESET_TOKEN: ${APP_EXPOSE_RESET_TOKEN:-true}
      # Adresse publique : c'est elle qui rend cliquables les liens envoyés.
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
      # Envoi des courriels. Éteint, rien n'est contacté.
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-cyberMans <no-reply@cybermans.local>}
      # « mail » n'existe qu'avec docker-compose.mail.yml, qui le fixe lui-même :
      # le défaut ici doit rester un hôte inoffensif.
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_AUTH: ${MAIL_AUTH:-false}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-false}
      APP_HYPERVISOR_MODE: ${APP_HYPERVISOR_MODE:-simulated}
      # Comptes promus administrateurs (séparés par des virgules).
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-}
      APP_MEDIA_DIRECTORY: /var/lib/labplatform/media
      # Abonnement Pro. « simulated » déroule le parcours sans prestataire :
      # pratique pour essayer, mais l'abonnement s'obtient alors en cliquant.
      APP_BILLING_ENABLED: ${APP_BILLING_ENABLED:-true}
      APP_BILLING_MODE: ${APP_BILLING_MODE:-simulated}
      APP_BILLING_METHODS: ${APP_BILLING_METHODS:-CARD,WAVE}
      APP_BILLING_CURRENCY: ${APP_BILLING_CURRENCY:-XOF}
      APP_BILLING_MONTHLY: ${APP_BILLING_MONTHLY:-5000}
      APP_BILLING_YEARLY: ${APP_BILLING_YEARLY:-50000}
      APP_BILLING_CARD_CURRENCY: ${APP_BILLING_CARD_CURRENCY:-EUR}
      APP_BILLING_CARD_MONTHLY: ${APP_BILLING_CARD_MONTHLY:-8.00}
      APP_BILLING_CARD_YEARLY: ${APP_BILLING_CARD_YEARLY:-80.00}
      APP_BILLING_SUCCESS_URL: ${APP_BILLING_SUCCESS_URL:-http://localhost:3000/abonnement/retour}
      APP_BILLING_CANCEL_URL: ${APP_BILLING_CANCEL_URL:-http://localhost:3000/abonnement}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      WAVE_API_KEY: ${WAVE_API_KEY:-}
      WAVE_WEBHOOK_SECRET: ${WAVE_WEBHOOK_SECRET:-}
      # Démo : les machines étant simulées, les flags du catalogue sont
      # écrits dans les journaux du backend au premier démarrage.
      APP_BOXES_LOG_SEEDED_FLAGS: ${APP_BOXES_LOG_SEEDED_FLAGS:-true}
      # Accès VPN (page « VPN Access ») : adresse publique de la passerelle OpenVPN.
      APP_VPN_ENABLED: ${APP_VPN_ENABLED:-false}
      APP_VPN_UDP_HOST: ${APP_VPN_UDP_HOST:-}
      APP_VPN_UDP_PORT: ${APP_VPN_UDP_PORT:-1194}
      APP_VPN_TCP_HOST: ${APP_VPN_TCP_HOST:-}
      APP_VPN_TCP_PORT: ${APP_VPN_TCP_PORT:-1194}
      APP_VPN_LAB_NETWORK: ${APP_VPN_LAB_NETWORK:-10.10.10.0/24}
      # « generated » : un certificat par apprenant. « uploaded » : un profil
      # déposé par l'administration, le même pour tous (docs/VPN.md).
      APP_VPN_SOURCE: ${APP_VPN_SOURCE:-generated}
      # Cible partagée pilotée par /api/machine. « simulated » par défaut :
      # aucun projet GCP n'est nécessaire. Le montage Compute Engine complet
      # est dans docker-compose.gcp.yml, qui monte aussi la clé du compte de
      # service — sans elle, « gcp » ne peut pas s'authentifier.
      APP_MACHINE_PROVIDER: ${APP_MACHINE_PROVIDER:-simulated}
      # Adresse montrée à l'apprenant, quand elle diffère de celle que
      # l'hébergeur rapporte (docs/GCP.md). Vide : celle de l'hébergeur.
      APP_MACHINE_ADDRESS: ${APP_MACHINE_ADDRESS:-}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-}
      GCP_ZONE: ${GCP_ZONE:-europe-west1-b}
      GCP_INSTANCE_NAME: ${GCP_INSTANCE_NAME:-target-01}
      GCP_OPERATION_TIMEOUT: ${GCP_OPERATION_TIMEOUT:-60s}
      GCP_TARGET_NAME: ${GCP_TARGET_NAME:-target-{slug}}
      APP_GCP_TARGET_MODE: ${APP_GCP_TARGET_MODE:-shared}
      APP_GCP_TARGET_IMAGE: ${APP_GCP_TARGET_IMAGE:-}
      APP_GCP_TARGET_MACHINE_TYPE: ${APP_GCP_TARGET_MACHINE_TYPE:-e2-small}
      APP_GCP_TARGET_DISK_SIZE: ${APP_GCP_TARGET_DISK_SIZE:-20}
      APP_GCP_TARGET_DISK_TYPE: ${APP_GCP_TARGET_DISK_TYPE:-pd-standard}
      APP_GCP_TARGET_SUBNETWORK: ${APP_GCP_TARGET_SUBNETWORK:-}
      APP_GCP_TARGET_TAGS: ${APP_GCP_TARGET_TAGS:-}
      # Taille maximale d'une vidéo de cours. Relever aussi client_max_body_size
      # dans nginx.conf, sinon le frontend refuse avant le backend.
      APP_MEDIA_MAX_FILE_SIZE: ${APP_MEDIA_MAX_FILE_SIZE:-256MB}
      APP_BOXES_LEADERBOARD_SIZE: ${APP_BOXES_LEADERBOARD_SIZE:-20}
      APP_BOXES_INSTANCE_LIFETIME: ${APP_BOXES_INSTANCE_LIFETIME:-2h}
    volumes:
      # Autorité de certification VPN : à sauvegarder, sa perte invalide tous les profils.
      - vpn-data:/var/lib/labplatform/vpn
      # Vidéos de cours téléversées : à sauvegarder également.
      - media-data:/var/lib/labplatform/media
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 3s
      start_period: 40s
      retries: 10
    # Pas de port publié : le backend n'est joignable que via le proxy Nginx.

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db-data:
  vpn-data:
  media-data:
